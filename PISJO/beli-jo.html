<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style.css">

<body class="subpage"><nav aria-label="Navigasi utama"><a href="index.html">Beranda</a><a href="tentang-jo.html">Tentang JO</a><a href="info-jo.html">Info JO</a><a href="beli-jo.html">Beli JO</a><a href="promo-jo.html">Promo JO</a></nav><main>

    <div class="container">

        <h1>🍌 JO INGIN MEMBELI 🍌</h1>

        <p class="deskripsi">
            JO... Silahkan pilih menu yang JO suka!
        </p>

        <div class="form-pesan">

            <label for="nama" class="judul-input">
                Namamu JOO:
            </label>

            <input 
                type="text" 
                id="nama" 
                name="nama" 
                placeholder="Masukkan nama kamu..."
            >

            <h2>🍹 Pilih Menu</h2>

            <div class="menu-container">

                <label class="menu">
                    <input 
                        type="radio" 
                        id="espijo" 
                        name="menu" 
                        value="Es Pisang Ijo"
                    >

                    <img 
                        src="ijo.jpg" 
                        alt="Es Pisang Ijo"
                    >

                    <span>Es Pisang Ijo</span>
                </label>


                <label class="menu">
                    <input 
                        type="radio" 
                        id="pisangcokelat" 
                        name="menu" 
                        value="Pisang Cokelat"
                    >

                    <span class="menu-placeholder">Foto Pisang Cokelat belum tersedia</span>

                    <span>Pisang Cokelat</span>
                </label>

            </div>

            <p class="status-note">Formulir demo: pesanan belum dapat dikirim. Kontak penjual belum tersedia.</p><button type="button" disabled>
                🛒 KIRIM PESANAN
            </button>

        </div>

    </div>

</main></body>
</html>
